name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun test

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: yatta:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test container
        run: |
          set -euo pipefail
          docker run -d --name yatta-ci -p 4000:4000 \
            -e NODE_ENV=production \
            -e STORAGE_SECRET=ci-smoke-test-secret-value \
            -e YATTA_CLUSTER_MODE=false \
            -e APP_URL=https://ci-smoke-test.example.com \
            -e AUTH_SECRET=ci-smoke-test-auth-secret-min-32-chars-long \
            yatta:ci

          # Wait for liveness to come up.
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4000/healthz >/dev/null 2>&1; then
              echo "container healthy after ${i}s"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "::error::container never became healthy"
              docker logs yatta-ci
              exit 1
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4000/healthz
          echo
          curl -fsS http://127.0.0.1:4000/readyz
          echo

          docker stop yatta-ci
          docker logs yatta-ci 2>&1 | grep -q "\[shutdown\] Complete\." \
            || { echo "::error::graceful shutdown did not complete"; docker logs yatta-ci; exit 1; }
          docker rm -f yatta-ci
